[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-trace-review"
version = "0.1.0"
description = "Offline manual review and redacted export of synthetic action traces"
requires-python = ">=3.11"
dependencies = ["Pillow==11.3.0"]

[project.scripts]
activity-trace = "activity_trace_review.cli:main"

[tool.setuptools.package-data]
activity_trace_review = ["web/*"]
